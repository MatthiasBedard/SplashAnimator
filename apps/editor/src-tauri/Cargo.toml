[package]
name = "splash-animator"
version = "0.1.0"
description = "Splash Animator vector animation editor"
edition = "2021"
rust-version = "1.90"

[features]
native-smoke = []
native-project-test = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.23.1"
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"
uuid = { version = "1", features = ["v4", "serde"] }
tempfile = "3"
sha2 = "0.11"
same-file = "1.0.6"
fs2 = "0.4.3"
tauri-plugin-updater = "2.14.1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Graphics_DirectWrite", "Win32_Storage_FileSystem"] }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
webkit2gtk = "2.0"
