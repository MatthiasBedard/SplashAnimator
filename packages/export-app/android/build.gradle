plugins {
    id 'com.android.application' version '8.13.2'
}

def projectApp = new Properties()
file('project-app.properties').withInputStream { projectApp.load(it) }

android {
    namespace 'com.splashanimator.player'
    compileSdk 36
    buildToolsVersion '35.0.0'

    defaultConfig {
        applicationId projectApp.getProperty('applicationId')
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '1.0.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
